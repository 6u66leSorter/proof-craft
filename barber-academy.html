const tg = window.Telegram?.WebApp;

/* ═══════════════════════════════════════════
   DATABASE (localStorage)
   ═══════════════════════════════════════════ */
const DB={
  _p:'ba_',
  get(k){try{const v=localStorage.getItem(this._p+k);return v?JSON.parse(v):null}catch{return null}},
  set(k,v){try{localStorage.setItem(this._p+k,JSON.stringify(v))}catch(e){console.error(e)}},
  del(k){localStorage.removeItem(this._p+k)},
  keys(prefix){const p=this._p+(prefix||'');const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(p))r.push(k.slice(this._p.length))}return r},
  all(prefix){return this.keys(prefix).map(k=>this.get(k)).filter(Boolean)}
};

/* ═══════════════════════════════════════════
   APP STATE
   ═══════════════════════════════════════════ */
let state={
  user:null, // current logged-in user
  scr:'role', // current screen
  stack:[], // nav stack
  sel:null, // selected student
  selHw:null, // selected hw
  tab:'pending', // admin/student/teacher tab
};

const el=id=>document.getElementById(id);
const $=document.getElementById.bind(document);
const app=$('app');

function go(s,data){
  state.stack.push(state.scr);
  state.scr=s;
  if(data?.student)state.sel=data.student;
  if(data?.hw)state.selHw=data.hw;
  if(data?.teacher)state.selTeacher=data.teacher;
  render();
}
function back(){
  state.scr=state.stack.pop()||'role';
  render();
}
function setTab(t){state.tab=t;render();}

/* ═══════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════ */
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const ini=(f,l)=>((f?.[0]||'')+(l?.[0]||'')).toUpperCase();
const statusMap={student:'Ученик',intern:'Стажировщик',barber:'Барбер'};
const statusClr={student:'var(--gold)',intern:'var(--blue)',barber:'var(--success)'};

function avatar(src,f,l,big){
  const cls=big?'av av-lg':'av';
  const center=big?'display:block;margin:0 auto;':'';
  if(src)return `<img src="${esc(src)}" class="${cls}" style="${center}" alt="">`;
  return `<div class="${cls} av-ph${big?' av-lg':''}" style="${center}">${esc(ini(f,l))}</div>`;
}
function badge(status){
  const c=statusClr[status]||'var(--gold)';
  return `<span class="badge" style="background:${c}18;color:${c};border:1px solid ${c}40">${esc(statusMap[status]||'Ученик')}</span>`;
}
function getHwPhotos(hw){
  if(hw.photos&&hw.photos.length)return hw.photos;
  if(hw.photo)return [hw.photo];
  return [];
}
function canSeePhone(s){
  if(!state.user)return false;
  return state.user.id===s.id||state.user.role==='admin';
}

function getStudents(){return DB.all('student:').filter(x=>x.role==='student');}
function getTeachers(){return DB.all('teacher:').filter(x=>x.role==='teacher');}
function getHws(sid){return DB.all('hw:'+sid+':').sort((a,b)=>b.ts-a.ts);}
function getNotifs(uid){return DB.all('notif:'+uid+':').sort((a,b)=>b.ts-a.ts);}
function addNotif(uid,msg,extra){DB.set('notif:'+uid+':'+genId(),{id:genId(),msg,ts:Date.now(),read:false,...(extra||{})});}

function toast(msg){
  const d=document.createElement('div');d.className='toast';d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2200);
}

function compressImg(file,cb,max=420){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(max/img.width,max/img.height,1);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6));};img.src=e.target.result;};
  r.readAsDataURL(file);
}

function hdr(title,showBack=true,rightHtml=''){
  return `<div class="hdr">${showBack?`<button class="hdr-btn" onclick="back()">${ICO.back}</button>`:''}<h2>${esc(title)}</h2>${rightHtml}</div>`;
}

      {r:'student',l:'Ученик',i:ICO.user,d:'Обучение и портфолио'},

             transition:all .18s">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#080808;flex-shrink:0;box-shadow:0 0 12px rgba(201,162,39,.5)">${x.i}</div>

window.doAdmLogin=function(){

window.doLogin=function(role){
  const phone=el('l-phone')?.value?.trim();if(!phone){el('login-err').textContent='Введите номер';return;}
  const list=role==='teacher'?getTeachers():getStudents();
  const u=list.find(x=>x.phone===phone);
  if(!u){el('login-err').textContent='Не найден';return;}
  if(!u.approved){el('login-err').textContent='Заявка ещё не одобрена';return;}
  state.user=u;go(role);
};

window.doRegister=function(role){
  const fn=el('r-fn')?.value?.trim(),ln=el('r-ln')?.value?.trim(),ph=el('r-phone')?.value?.trim();
  if(!fn||!ln||!ph){el('login-err').textContent='Заполните все поля *';return;}
  const list=role==='teacher'?getTeachers():getStudents();
  if(list.find(x=>x.phone===ph)){el('login-err').textContent='Номер уже зарегистрирован';return;}
  const u={id:genId(),role,firstName:fn,lastName:ln,phone:ph,metro:el('r-metro')?.value?.trim()||'',photo:regPhoto||'',status:role==='student'?'student':undefined,teacherIds:[],lessons:0,approved:false,ts:Date.now()};
  const prefix=role==='teacher'?'teacher':'student';
  DB.set(prefix+':'+u.id,u);
  addNotif('admin',`Новая заявка: ${role==='teacher'?'преподаватель':'ученик'} ${fn} ${ln}`);
  regPhoto='';
  el('login-form').innerHTML=`<div style="text-align:center;padding:28px">
    <div style="width:52px;height:52px;border-radius:50%;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--gold);box-shadow:0 0 20px rgba(201,162,39,.3)">${ICO.clock}</div>

};

window.saveHwGrade=function(){

  DB.set('hw:'+hw.sid+':'+hw.id,hw);
  addNotif(hw.sid,'ДЗ #'+hw.num+' проверено. Оценка: '+g,{hwId:hw.id,hwSid:hw.sid});
  state.selHw=hw;
  toast('Оценка сохранена');
  render();
};

let correctionPhoto='';

let hwPhotos=[];
function renderHwPhotosGrid(){
  const g=el('hw-photos-grid');if(!g)return;
  g.innerHTML=hwPhotos.map((p,i)=>`<div style="position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1.5px solid var(--border);box-shadow:var(--glow)">
    <img src="${p}" style="width:100%;height:100%;object-fit:cover">
    <button onclick="removeHwPhoto(${i})" style="position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(201,162,39,.3);color:var(--gold);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
  </div>`).join('');
}
window.removeHwPhoto=function(i){hwPhotos.splice(i,1);renderHwPhotosGrid();};
window.handleHwPhotos=function(inp){
  const files=Array.from(inp.files);if(!files.length)return;
  let pending=files.length;
  files.forEach(f=>{compressImg(f,d=>{hwPhotos.push(d);pending--;if(pending===0)renderHwPhotosGrid();});});
  inp.value='';
};
window.submitHw=function(){
  const num=el('hw-num')?.value?.trim(),title=el('hw-title')?.value?.trim(),desc=el('hw-desc')?.value?.trim();
  if(!num||!title||!desc){toast('Заполните все поля');return;}
  const hw={id:genId(),sid:state.user.id,num,title,desc,photos:hwPhotos.length?[...hwPhotos]:[],photo:'',grade:null,comment:null,commentBy:null,ts:Date.now()};
  if(hwPhotos.length)hw.photo=hwPhotos[0];
  DB.set('hw:'+state.user.id+':'+hw.id,hw);
  if(state.user.teacherIds&&state.user.teacherIds.length) state.user.teacherIds.forEach(tid=>addNotif(tid,state.user.firstName+' '+state.user.lastName+' сдал ДЗ #'+num+': '+title,{hwId:hw.id,hwSid:state.user.id}));
  hwPhotos=[];toast('Задание отправлено');back();
};

// ── Notifications ──
function scrNotifs(){
  const ns=getNotifs(state.user.id);

  return `<div style="padding:12px">

      return `<div class="card" style="margin-bottom:6px;${cursor}${n.read?'':`border-left:3px solid var(--gold);box-shadow:0 0 14px rgba(201,162,39,.15)`}" ${onclick}>

// ── Chat ──
function scrChat(sid){
  const msgs=DB.all('chat:'+sid+':').sort((a,b)=>a.ts-b.ts);
  const rc={admin:'var(--danger)',teacher:'var(--success)',student:'var(--gold)'};
  const rl={admin:'админ',teacher:'преподаватель',student:'ученик'};
  setTimeout(()=>{const c=el('chat-scroll');if(c)c.scrollTop=c.scrollHeight;},50);
  return `<div style="display:flex;flex-direction:column;height:100%">
    <div id="chat-scroll" style="flex:1;overflow-y:auto;padding:10px">
      ${msgs.length===0?'<p class="empty">Начните общение</p>':msgs.map(m=>`
        <div style="margin-bottom:8px;text-align:${m.aId===state.user.id?'right':'left'}">
          <div class="msg-bubble ${m.aId===state.user.id?'msg-mine':'msg-other'}">
            <div style="font-size:9px;font-weight:700;color:${rc[m.aRole]||'var(--gold)'};font-family:var(--font-body);margin-bottom:1px">${esc(m.aName)} <span style="font-weight:400;color:var(--dim)">(${rl[m.aRole]||''})</span></div>
            <p style="margin:0">${esc(m.text)}</p>
            <div style="font-size:8px;color:var(--dim);font-family:var(--font-body);margin-top:2px">${new Date(m.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="chat-input-row">
      <input class="inp" id="chat-input" placeholder="Сообщение..." style="flex:1" onkeydown="if(event.key==='Enter')sendChat('${sid}')">
      <button class="btn bf bs" onclick="sendChat('${sid}')" style="padding:8px 10px">${ICO.send}</button>
    </div>
  </div>`;
}
window.sendChat=function(sid){
  const inp=el('chat-input');const t=inp?.value?.trim();if(!t)return;
  const m={id:genId(),sid,aId:state.user.id,aName:state.user.firstName+' '+state.user.lastName,aRole:state.user.role,text:t,ts:Date.now()};
  DB.set('chat:'+sid+':'+m.id,m);inp.value='';render();
};

// STUDENT HOME
// ═══════════════════════════════════════════
function scrStudent(){
  const t=state.tab||'profile';
  const unread=getNotifs(state.user.id).filter(n=>!n.read).length;
  let content='';
  if(t==='profile') content=hdr('Мой профиль',false,`<button class="hdr-btn" style="color:var(--dim)" onclick="logout()">${ICO.logout}</button>`)+`<div class="scr">${profileView(state.user)}</div>`;
  else if(t==='notifs') content=hdr('Уведомления',false)+`<div class="scr">${scrNotifs()}</div>`;
  else if(t==='chat') content=hdr('Чат',false)+scrChat(state.user.id);
  return content+tabBar([
    {k:'profile',i:ICO.user,l:'Профиль'},
    {k:'notifs',i:ICO.bell,l:'Увед.',c:unread},
    {k:'chat',i:ICO.chat,l:'Чат'},
  ],t);
}

    {k:'students',i:ICO.users,l:'Ученики'},

// ═══════════════════════════════════════════
// ADMIN HOME
// ═══════════════════════════════════════════
function scrAdmin(){
  const t=state.tab||'pending';
  const allS=getStudents(),allT=getTeachers();
  const pending=[...allS.filter(s=>!s.approved),...allT.filter(x=>!x.approved)];
  const approved=allS.filter(s=>s.approved);
  const approvedT=allT.filter(x=>x.approved);
  const unread=getNotifs('admin').filter(n=>!n.read).length;

  let content='';

  if(t==='pending'){
    content=hdr('Заявки',false,`<button class="hdr-btn" style="color:var(--dim)" onclick="logout()">${ICO.logout}</button>`)+`<div class="scr" style="padding:12px">
      ${pending.length===0?`<div class="empty"><div style="margin-bottom:8px">${ICO.check}</div>Все заявки обработаны</div>`:`
        <p style="color:var(--dim);font-family:var(--font-body);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Ожидают · ${pending.length}</p>
        ${pending.map(u=>{
          const isS=u.role==='student';
          return `<div class="card pending-card" style="margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              ${avatar(u.photo,u.firstName,u.lastName)}
              <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(u.firstName)} ${esc(u.lastName)}</div>
              <div style="font-size:10px;color:var(--dim);font-family:var(--font-body)">${isS?'Ученик':'Преподаватель'} · ${esc(u.phone)}</div>
              ${u.metro?`<div style="font-size:9px;color:var(--dim);font-family:var(--font-body)">Метро: ${esc(u.metro)}</div>`:''}</div>
            </div>
            ${isS?`<div style="margin-bottom:8px"><div style="font-size:10px;color:var(--dim);font-family:var(--font-body);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Назначить преподавателей:</div>
              <div class="tcb-wrap">
              ${approvedT.map(tt=>{const cnt=approved.filter(ss=>(ss.teacherIds||[]).includes(tt.id)).length;return `<label class="tcb"><input type="checkbox" class="pa-cb-${u.id}" value="${tt.id}"><span class="tcb-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#080808" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="tcb-info"><div class="tcb-name">${esc(tt.firstName)} ${esc(tt.lastName)}</div><div class="tcb-sub">Учеников: ${cnt}</div></div></label>`}).join('')}
              </div>
            </div>`:''}
            <div style="display:flex;gap:6px">
              <button class="btn bg-btn bs" style="flex:1" onclick="approveUser('${u.id}','${u.role}')">${ICO.check} Одобрить</button>
              <button class="btn bd bs" style="flex:1" onclick="rejectUser('${u.id}','${u.role}')">${ICO.x} Отклонить</button>
            </div>
          </div>`}).join('')}
      `}
    </div>`;
  } else if(t==='students'){
    content=hdr('Ученики ('+approved.length+')',false)+`<div class="scr" style="padding:12px">
      ${approved.map(s=>{
        const stchs=(s.teacherIds||[]).map(tid=>approvedT.find(x=>x.id===tid)).filter(Boolean);
        return `<div class="card" style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:10px">
            ${avatar(s.photo,s.firstName,s.lastName)}
            <div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(s.firstName)} ${esc(s.lastName)}</div>
            <div style="font-size:9px;color:var(--dim);font-family:var(--font-body);line-height:1.5">${esc(s.phone)} · <span style="color:${statusClr[s.status]}">${statusMap[s.status]}</span> · ${s.lessons||0} зан.<br>Преп: <span style="color:${stchs.length?'var(--text)':'var(--warn)'}">${stchs.length?stchs.map(t=>esc(t.firstName)+' '+esc(t.lastName)).join(', '):'не назначен'}</span></div></div>
          </div>
          <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">
            <button class="btn bs" onclick="go('a-student',{student:${JSON.stringify(s).replace(/"/g,'&quot;')}})">${ICO.eye}</button>
            <button class="btn bs" onclick="openEdit('${s.id}')">${ICO.gear} Настроить</button>
            <button class="btn bs" onclick="go('chat-view',{student:${JSON.stringify(s).replace(/"/g,'&quot;')}})">${ICO.chat}</button>
          </div>
          <div id="edit-${s.id}" style="display:none;margin-top:8px;padding:12px;background:linear-gradient(135deg,rgba(201,162,39,.06) 0%,rgba(201,162,39,.02) 100%);border:1px solid var(--border);border-radius:16px">
            <div style="margin-bottom:8px"><div style="font-size:10px;color:var(--dim);font-family:var(--font-body);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Преподаватели:</div>
              <div class="tcb-wrap">
              ${approvedT.map(tt=>{const cnt=approved.filter(ss=>(ss.teacherIds||[]).includes(tt.id)).length;const checked=(s.teacherIds||[]).includes(tt.id);return `<label class="tcb"><input type="checkbox" class="et-cb-${s.id}" value="${tt.id}" ${checked?'checked':''}><span class="tcb-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#080808" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="tcb-info"><div class="tcb-name">${esc(tt.firstName)} ${esc(tt.lastName)}</div><div class="tcb-sub">Учеников: ${cnt}${checked?' · ✓ назначен':''}</div></div></label>`}).join('')}

            <input class="inp" id="el-${s.id}" type="number" placeholder="Кол-во занятий" value="${s.lessons||''}" style="font-size:11px;margin-bottom:6px">
            <select class="inp" id="es-${s.id}" style="font-size:11px;margin-bottom:6px">

              <button class="btn bf bs" style="flex:1" onclick="saveEdit('${s.id}')">${ICO.check} Сохранить</button>
              <button class="btn bs" style="flex:1" onclick="el('edit-${s.id}').style.display='none'">Отмена</button>
            </div>

  } else if(t==='teachers'){
    content=hdr('Преподаватели ('+approvedT.length+')',false)+`<div class="scr" style="padding:12px">
      ${approvedT.map(tt=>{
        const cnt=approved.filter(s=>(s.teacherIds||[]).includes(tt.id)).length;
        const myStudents=approved.filter(s=>(s.teacherIds||[]).includes(tt.id));
        return `<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="go('a-teacher',{teacher:${JSON.stringify(tt).replace(/"/g,'&quot;')}})">
          <div style="display:flex;align-items:center;gap:10px">
          ${avatar(tt.photo,tt.firstName,tt.lastName)}

          <div style="font-size:10px;color:var(--dim);font-family:var(--font-body)">${esc(tt.phone)} · Учеников: ${cnt}</div></div>
          <span style="color:var(--gold);opacity:.5">${ICO.back.replace('transform:','transform:rotate(180deg);')}</span>
          </div>
        </div>`}).join('')}
      ${approvedT.length===0?'<p class="empty">Нет преподавателей</p>':''}
    </div>`;
  } else if(t==='notifs'){
    content=hdr('Уведомления',false)+`<div class="scr">${scrNotifs()}</div>`;
  }
  return content+tabBar([
    {k:'pending',i:ICO.inbox,l:'Заявки',c:pending.length},
    {k:'students',i:ICO.users,l:'Ученики'},
    {k:'teachers',i:ICO.book,l:'Преп.'},
    {k:'notifs',i:ICO.bell,l:'Увед.',c:unread},
  ],t);
}

window.approveUser=function(id,role){
  const p=role==='teacher'?'teacher':'student';
  const u=DB.get(p+':'+id);if(!u)return;
  u.approved=true;
  if(u.role==='student'){
    const cbs=document.querySelectorAll('.pa-cb-'+id);
    const tids=[];cbs.forEach(cb=>{if(cb.checked)tids.push(cb.value);});
    u.teacherIds=tids;
  }
  DB.set(p+':'+u.id,u);
  addNotif(u.id,'Ваша заявка одобрена! Добро пожаловать в MADCAP Academy.');
  toast('Одобрено');render();
};
window.rejectUser=function(id,role){
  const p=role==='teacher'?'teacher':'student';
  DB.del(p+':'+id);
  toast('Отклонено');render();
};
window.openEdit=function(sid){
  const e=el('edit-'+sid);if(e)e.style.display=e.style.display==='none'?'block':'none';
};
window.saveEdit=function(sid){
  const s=DB.get('student:'+sid);if(!s)return;
  const cbs=document.querySelectorAll('.et-cb-'+sid);
  const tids=[];cbs.forEach(cb=>{if(cb.checked)tids.push(cb.value);});
  s.teacherIds=tids;
  const l=el('el-'+sid)?.value;const st=el('es-'+sid)?.value;
  if(l)s.lessons=parseInt(l); if(st)s.status=st;
  DB.set('student:'+sid,s);
  toast('Сохранено');render();
};

// ── Tab Bar ──
function tabBar(tabs,active){
  return `<div class="tab">${tabs.map(t=>`
    <button class="tb${t.k===active?' on':''}" onclick="setTab('${t.k}')">
      <span style="position:relative">${t.i}${t.c>0?`<span class="dot">${t.c}</span>`:''}</span>${t.l}
    </button>`).join('')}</div>`;
}

window.logout=function(){state.user=null;state.scr='role';state.stack=[];state.tab='pending';render();};

/* ═══════════════════════════════════════════
   RENDER ENGINE
   ═══════════════════════════════════════════ */
function render(){
  let html='';
  switch(state.scr){
    case 'role':html=scrRole();break;
    case 'login-student':case 'login-teacher':case 'login-admin':html=scrLogin(state.scr.split('-')[1]);break;
    case 'student':html=scrStudent();break;
    case 'teacher':html=scrTeacher();break;
    case 'admin':html=scrAdmin();break;
    case 'guest':html=scrGuest();break;
    case 'g-student':html=scrGStudent();break;
    case 'hw-new':html=scrHwNew();break;
    case 'hw-view':html=scrHwView();break;
    case 't-student':html=scrTStudent();break;
    case 'a-student':html=scrAStudent();break;
    case 'a-teacher':html=scrATeacher();break;
    case 'chat-view':html=hdr('Чат')+scrChat(state.sel.id);break;
    default:html=scrRole();
  }
  app.innerHTML=html;

  // Post-render hooks
  if(state.scr.startsWith('login-')&&state.scr!=='login-admin'){
    loginMode='login';switchLoginMode('login');
  }

  // Telegram back button
  if(tg){
    if(state.stack.length>0){tg.BackButton.show();tg.BackButton.onClick(back);}
    else tg.BackButton.hide();
  }
}

render();
</script>
